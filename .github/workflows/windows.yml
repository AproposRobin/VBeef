# Windows build, tests, packages, build attestation and release upload. docs/CI.md describes every step;
# scripts/ci-github-local.ps1 runs the same steps (scripts/ci-windows.ps1) on a developer machine.
name: Windows

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Tool locations. The pins (versions and sha256) are in scripts/ci-windows.ps1; the tools are downloaded from
  # their upstream release pages and checked against those hashes before use.
  VB_TOOLS: C:\vb\tools
  VB_WORK: C:\vb\work
  VB_DIST: C:\vb\dist
  # The suites look for Beef here (hard-coded in the tests), so the pinned Beef is unpacked into this folder.
  VB_BEEF_HOME: C:\Program Files\BeefLang

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the file version of the exe is major.minor.patch.<commit count> (scripts/package.ps1).
          fetch-depth: 0
          persist-credentials: false

      - name: Cache tool downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VB_TOOLS }}\dl
          # The downloads are verified against sha256 pins in scripts/ci-windows.ps1 whatever the cache holds.
          key: vbtools-65ee0f1c-317492c4-f15cff5f-v1

      - name: Fetch Beef 0.43.6, llvm-mingw, SDL2
        shell: powershell
        run: scripts\ci-windows.ps1 -Step fetch -Tools $env:VB_TOOLS -Work $env:VB_WORK -BeefHome $env:VB_BEEF_HOME

      - name: Native host (vbhost.dll from source)
        shell: powershell
        run: scripts\ci-windows.ps1 -Step host -Tools $env:VB_TOOLS -Work $env:VB_WORK -BeefHome $env:VB_BEEF_HOME

      - name: Build (BeefBuild)
        shell: powershell
        run: scripts\ci-windows.ps1 -Step build -Tools $env:VB_TOOLS -Work $env:VB_WORK -BeefHome $env:VB_BEEF_HOME

      - name: Tests
        shell: powershell
        run: scripts\ci-windows.ps1 -Step test -Tools $env:VB_TOOLS -Work $env:VB_WORK -BeefHome $env:VB_BEEF_HOME

      - name: Packages
        shell: powershell
        run: scripts\ci-windows.ps1 -Step package -Tools $env:VB_TOOLS -Work $env:VB_WORK -Dist $env:VB_DIST -BeefHome $env:VB_BEEF_HOME

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visualbeef-win64
          path: |
            ${{ env.VB_DIST }}\*.zip
            ${{ env.VB_DIST }}\*.zip.sha256
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build-logs
          path: |
            ${{ env.VB_WORK }}\*.log
            ${{ env.VB_WORK }}\*.err
            ${{ env.VB_WORK }}\suites\*.log
          if-no-files-found: ignore

  release:
    # A v* tag puts the packages on ONE draft pre-release for the tag (the Linux workflow adds its files to the same
    # draft), with a build attestation for each zip and .sha256 file. Nothing is public yet: the owner signs release.json
    # and publishes with scripts/release.mjs (docs/Releasing.md). Releases are not code-signed. The build job holds no
    # write permission.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write   # build attestation: the signing identity of the provenance statement
      attestations: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: visualbeef-win64
          path: release

      - name: Attest build provenance (zips and .sha256 files)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.sha256

      - name: Add the packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l release
          note="Packages built from this tag by the Windows and Linux workflows. Draft until the owner signs release.json and publishes it (docs/Releasing.md). See docs/Code-Signing.md to verify the files."
          # The Linux workflow may create the draft at the same moment: create, else take the one that exists.
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --verify-tag --draft --prerelease --title "VisualBeef $TAG" --notes "$note" || gh release view "$TAG" --repo "$REPO" > /dev/null
          fi
          gh release upload "$TAG" --repo "$REPO" --clobber release/*.zip release/*.zip.sha256
