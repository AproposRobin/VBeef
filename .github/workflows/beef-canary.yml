# Beef canary: once a week, builds and tests VisualBeef on the newest Beef builds, to see what a newer Beef breaks before
# the pin is moved (docs/CI.md, "Beef canary"). Windows: the newest dated nightly on nightly.beeflang.org. Linux: the
# master branch of beefytech/Beef. Scheduled runs use the default branch. Nothing depends on this workflow: it is not a
# required check, and a red run is information, not a gate.
name: Beef canary

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beef-canary-${{ github.ref }}
  cancel-in-progress: true

env:
  VB_TOOLS: C:\vb\tools
  VB_WORK: C:\vb\work
  VB_BEEF_HOME: C:\Program Files\BeefLang
  BEEF_DIR: /home/runner/beef-master
  JOBS_NICE: "0"

jobs:
  windows-nightly:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the newest Beef nightly (unpinned), llvm-mingw, SDL2
        id: fetch
        shell: powershell
        run: scripts\ci-windows.ps1 -Step fetch -AllowUnpinned -Tools $env:VB_TOOLS -Work $env:VB_WORK -BeefHome $env:VB_BEEF_HOME

      - name: Native host (vbhost.dll from source)
        id: host
        shell: powershell
        run: scripts\ci-windows.ps1 -Step host -Tools $env:VB_TOOLS -Work $env:VB_WORK -BeefHome $env:VB_BEEF_HOME

      - name: Build (BeefBuild, Debug tests and Release editor)
        id: build
        shell: powershell
        run: scripts\ci-windows.ps1 -Step build -Tools $env:VB_TOOLS -Work $env:VB_WORK -BeefHome $env:VB_BEEF_HOME

      - name: Short suites
        id: test
        shell: powershell
        run: scripts\ci-windows.ps1 -Step test -Tools $env:VB_TOOLS -Work $env:VB_WORK -BeefHome $env:VB_BEEF_HOME

      - name: Verdict (job summary)
        if: ${{ always() }}
        shell: powershell
        env:
          OUT_FETCH: ${{ steps.fetch.outcome }}
          OUT_HOST: ${{ steps.host.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_TEST: ${{ steps.test.outcome }}
        run: |
          # The first step that did not succeed is what broke first (later steps are 'skipped' after a failure).
          $first = ''
          foreach ($s in 'FETCH', 'HOST', 'BUILD', 'TEST') {
            $o = [Environment]::GetEnvironmentVariable("OUT_$s")
            if ($o -ne 'success' -and -not $first) { $first = "$($s.ToLowerInvariant()) ($o)" }
          }
          $lines = @('', '### Verdict', '')
          if (-not $first) {
            $lines += '**PASS**: the Beef nightly built VisualBeef and every short suite passed.'
          } else {
            $lines += "**FAIL**: first failure in **$first**."
            if ($first -like 'test*' -and (Test-Path "$env:VB_WORK\first-failure.txt")) {
              $lines += "First failing suite: ``$((Get-Content "$env:VB_WORK\first-failure.txt" -TotalCount 1).Trim())`` (its log is in the windows-canary-logs artifact)."
            }
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $lines -Encoding utf8

      - name: Upload build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-canary-logs
          path: |
            ${{ env.VB_WORK }}\*.log
            ${{ env.VB_WORK }}\*.err
            ${{ env.VB_WORK }}\suites\*.log
          if-no-files-found: ignore

  linux-master:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build clang lld git ccache python3 \
            libzstd-dev libxml2-dev libedit-dev zlib1g-dev libcurl4-openssl-dev libffi-dev \
            autoconf automake libtool texinfo libsdl2-dev libgl1-mesa-dev curl ca-certificates

      - name: LLVM 22.1
        run: |
          # Ubuntu 24.04 does not ship LLVM 22: take it from apt.llvm.org (the same as linux.yml).
          if ! apt-cache show llvm-22-dev > /dev/null 2>&1; then
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
            echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm-22.list
            sudo apt-get update
          fi
          extra=""
          # apt.llvm.org's LLVM cmake files reference Polly; Ubuntu's own packages do not.
          if apt-cache show libpolly-22-dev > /dev/null 2>&1; then extra="libpolly-22-dev"; fi
          sudo apt-get install -y --no-install-recommends llvm-22-dev $extra
          llvm-config-22 --version

      - name: Resolve Beef master HEAD
        id: beef
        run: |
          sha=$(git ls-remote https://github.com/beefytech/Beef refs/heads/master | cut -f1)
          case "$sha" in
            [0-9a-f]*) ;;
            *) echo "could not resolve refs/heads/master of beefytech/Beef" >&2; exit 1 ;;
          esac
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Beef master HEAD: $sha (https://github.com/beefytech/Beef/commit/$sha)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Beef (master HEAD)
        id: build-beef
        env:
          BEEF_COMMIT: ${{ steps.beef.outputs.commit }}
        run: |
          git init -q "$BEEF_DIR"
          git -C "$BEEF_DIR" remote add origin https://github.com/beefytech/Beef
          git -C "$BEEF_DIR" fetch -q --depth 1 origin "$BEEF_COMMIT"
          git -C "$BEEF_DIR" checkout -q --detach FETCH_HEAD
          CMAKE_BUILD_PARALLEL_LEVEL=4 "$BEEF_DIR/bin/build.sh"

      - name: Check Beef
        id: check-beef
        env:
          BEEF_COMMIT: ${{ steps.beef.outputs.commit }}
        run: |
          test "$(git -C "$BEEF_DIR" rev-parse HEAD)" = "$BEEF_COMMIT"
          test -x "$BEEF_DIR/IDE/dist/BeefBuild"

      - name: Native host (libvbhost.so)
        id: host
        # The committed libvbhost.so was built on Ubuntu 26.04 (glibc 2.43): rebuild it here, as linux.yml does.
        run: NICE=0 JOBS=4 Native/build_linux.sh clean

      - name: Tests (scripts/linux-ci.sh)
        id: test
        run: |
          set -o pipefail
          scripts/linux-ci.sh 2>&1 | tee "$RUNNER_TEMP/linux-ci.log"

      - name: Verdict (job summary)
        if: ${{ always() }}
        env:
          OUT_BEEF: ${{ steps.build-beef.outcome }}
          OUT_CHECK: ${{ steps.check-beef.outcome }}
          OUT_HOST: ${{ steps.host.outcome }}
          OUT_TEST: ${{ steps.test.outcome }}
          LOG: ${{ runner.temp }}/linux-ci.log
        run: |
          # Suite counts from the summary table linux-ci.sh prints ("name  exit=N  secs  last line").
          if [ -f "$LOG" ]; then
            total=$(grep -cE '^[a-z-]+ +exit=' "$LOG" || true)
            failed=$(grep -cE '^[a-z-]+ +exit=[1-9]' "$LOG" || true)
            {
              echo "### Suites (Linux, Beef master)"
              echo
              echo '```'
              sed -n '/^== summary/,$p' "$LOG" | tail -n +2
              echo '```'
              echo
              echo "Suites: $total run, $failed failed"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          first=""
          for pair in "beef:$OUT_BEEF" "check:$OUT_CHECK" "host:$OUT_HOST" "tests:$OUT_TEST"; do
            name=${pair%%:*}
            o=${pair#*:}
            if [ -z "$first" ] && [ "$o" != "success" ]; then first="$name ($o)"; fi
          done
          {
            echo
            echo "### Verdict"
            echo
            if [ -z "$first" ]; then
              echo "**PASS**: Beef master built and every Linux suite passed."
            else
              echo "**FAIL**: first failure in **$first**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-canary-logs
          path: |
            ${{ runner.temp }}/linux-ci.log
            build/*.log
          if-no-files-found: ignore
